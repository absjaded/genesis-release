<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Genesis: implemented foundations and intended object</title>
  <desc id="desc">Matched cortical predictions and vision-model features feed source analysis. Controlled constructions and numerical bounds inform the future joint object. Dashed connections denote research still to be established.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657485"/></marker>
  </defs>
  <rect width="960" height="300" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#203044">
    <rect x="20" y="30" width="235" height="70" rx="9" fill="#eaf3f8" stroke="#97b6c8"/>
    <text x="38" y="58" font-size="18" font-weight="bold">Cortical predictions</text>
    <text x="38" y="82" font-size="15">TRIBE v2 · matched images</text>
    <rect x="20" y="123" width="235" height="70" rx="9" fill="#f4efe8" stroke="#cbb498"/>
    <text x="38" y="151" font-size="18" font-weight="bold">Vision-model features</text>
    <text x="38" y="175" font-size="15">DINOv2 · matched images</text>
    <rect x="326" y="63" width="256" height="100" rx="9" fill="#f5f7fa" stroke="#a5b0bd"/>
    <text x="344" y="94" font-size="18" font-weight="bold">Source correspondence</text>
    <text x="344" y="120" font-size="15">Readouts and geometry</text>
    <text x="344" y="144" font-size="15">Historical evaluation protocols</text>
    <rect x="326" y="213" width="256" height="70" rx="9" fill="#f5f7fa" stroke="#a5b0bd"/>
    <text x="344" y="241" font-size="18" font-weight="bold">Controlled constructions</text>
    <text x="344" y="265" font-size="15">Interventions and bounds</text>
    <rect x="734" y="90" width="205" height="105" rx="9" fill="#fff" stroke="#657485" stroke-dasharray="6 5"/>
    <text x="752" y="120" font-size="18" font-weight="bold">Joint object</text>
    <text x="752" y="146" font-size="15">Useful joint operation</text>
    <text x="752" y="175" font-size="14" fill="#627183">RESEARCH TARGET</text>
    <text x="604" y="75" font-size="14" fill="#627183">Evidence toward</text>
    <text x="604" y="94" font-size="14" fill="#627183">construction</text>
    <text x="20" y="253" font-size="14" fill="#627183">Solid: implemented analysis</text>
    <text x="20" y="275" font-size="14" fill="#627183">Dashed: intended connection</text>
  </g>
  <g fill="none" stroke="#657485" stroke-width="1.7" marker-end="url(#arrow)">
